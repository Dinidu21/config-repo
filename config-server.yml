server:
  port: 8888

spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Dinidu21/config-repo.git
          timeout: 10
          cloneOnStart: false

management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
