server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server.eventsphere.internal:8761/eureka/

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: venue-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/events/venues/**
              filters:
                - StripPrefix=2

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2

            - id: event-booking-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/events/**
              filters:
                - StripPrefix=1

            - id: booking-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/bookings/**
              filters:
                - StripPrefix=1

            - id: review-notification-service
              uri: lb://review-notification-service
              predicates:
                - Path=/api/reviews/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics

  endpoint:
    health:
      show-details: always
      show-components: always

    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.netflix.discovery: INFO
