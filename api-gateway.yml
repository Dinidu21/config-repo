server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server-1.eventsphere.internal:8761/eureka/,http://eureka-server-2.eventsphere.internal:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  cloud:
    gateway:
      # LoadBalancer Retry Policy: Retry on next instance if connection refused/timeout occurs
      loadbalancer:
        use404: true
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET, POST
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2 # /api/users/123 -> /123

        - id: venue-service
          uri: lb://event-booking-service
          predicates:
            - Path=/api/events/venues/**
          filters:
            - StripPrefix=3 # /api/events/venues/1 -> /1

        - id: event-booking-service
          uri: lb://event-booking-service
          predicates:
            - Path=/api/events/**, /api/ticket-types/**, /api/bookings/**
          filters:
            - StripPrefix=1 # Keeps /events/**, /ticket-types/**, /bookings/**

        - id: review-notification-service
          uri: lb://review-notification-service
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=2 # /api/reviews/health -> /health

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,refresh

  endpoint:
    health:
      show-details: always
      show-components: always

    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.netflix.discovery: INFO
