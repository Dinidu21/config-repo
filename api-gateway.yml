spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: venue-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/events/venues/**
              filters:
                - StripPrefix=2

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2

            - id: event-booking-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/events/**
              filters:
                - StripPrefix=1

            - id: booking-service
              uri: lb://event-booking-service
              predicates:
                - Path=/api/bookings/**
              filters:
                - StripPrefix=1

            - id: review-notification-service
              uri: lb://review-notification-service
              predicates:
                - Path=/api/reviews/**
              filters:
                - StripPrefix=2
